schema_version = "1.0"

[scenario]
name = "remediation-multiservice"
description = "Seven independent diagnose-then-fix remediation domains deployed into one account: a KMS-encrypted DynamoDB ledger, a Bedrock-backed document extraction service, an EventBridge fulfillment pipeline, an S3+CloudFront publish pipeline, an ECS/ECR container delivery plane, a GitHub-OIDC CodeBuild federation platform, and an SQS+Lambda order-ingest tier. Each domain seeds an intentionally-broken configuration a mutation task must diagnose and repair."
account_tags = ["PRIMARY"]
# All twelve stacks deploy in us-east-1. us-east-2 and us-west-2 are declared
# so the region-restrict SCP permits Bedrock cross-region inference profiles
# (e.g. `us.meta.llama3-3-70b-instruct-v1:0`) that route through those regions
# from us-east-1 endpoints — required by the bedrock task's router Lambda.
regions = ["us-east-1", "us-east-2", "us-west-2"]

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096

[deploy]
# Twelve stacks across seven domains deploy in one `cdk deploy --all`, each
# followed by its own post-deploy setup script (ECS image push, ledger seed,
# fulfillment/ingest traffic priming, CI/CD token seeding). Generous budget.
timeout_sec = 5400.0

[verify]
timeout_sec = 300.0

[reset]
# Re-runs all seven task post_invokes as a backstop. Each is idempotent, so this is
# a no-op after a completed trial; it only does work when a post_invoke was cut
# short. The CloudFront one waits for distributions to redeploy, which dominates.
timeout_sec = 1800.0

[cleanup]
timeout_sec = 5400.0
