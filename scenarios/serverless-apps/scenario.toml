schema_version = "1.0"

[scenario]
name = "serverless-apps"
description = "Complex multi-service environment: VPC, ALB, RDS, MSK, ECS, DocumentDB, Lambda, S3, SNS, Firehose. Single stack across us-east-1."
account_tags = ["PRIMARY"]
regions = ["us-east-1"]

[environment]
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096

[deploy]
timeout_sec = 3600.0

[verify]
timeout_sec = 120.0

[cleanup]
timeout_sec = 5400.0

[[quotas]]
account_tag = "PRIMARY"
region = "us-east-1"
service_code = "ec2"
quota_code = "L-1216C47A"
desired_value = 8
# ASG (2x t3.micro = 4 vCPUs) + EC2 instance (1x t3.micro = 2 vCPUs) = 6 needed. 8 with headroom.

[[quotas]]
account_tag = "PRIMARY"
region = "us-east-1"
service_code = "vpc"
quota_code = "L-F678F1CE"
desired_value = 5
# 1 VPC needed, default is 5 — just confirming.
