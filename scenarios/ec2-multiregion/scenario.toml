schema_version = "1.0"

[scenario]
name = "ec2-multiregion"
description = "Small EC2-only environment used for end-to-end env-setup validation. Two stacks (ec2_ks84v1fh1, ec2_ls9fuhb52) plus QARolesStack across us-east-1, us-west-1, and us-west-2."
account_tags = ["PRIMARY"]
regions = ["us-east-1", "us-west-1", "us-west-2"]

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096

[deploy]
timeout_sec = 1800.0

[verify]
timeout_sec = 120.0

[cleanup]
timeout_sec = 5400.0

[[quotas]]
account_tag = "PRIMARY"
region = "us-east-1"
service_code = "ec2"
quota_code = "L-1216C47A"
desired_value = 8
