---
name: "🐛 Bug Report"
description: Report a bug
title: "(scenario/task name): (short issue description)"
labels: [bug, needs-triage]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        **⚠️ Please read this before filling out the form below:**  
        If the bug you are reporting is a security-related issue or a security vulnerability,
        please report it via [Report a security vulnerability](https://aws.amazon.com/security/vulnerability-reporting/) instead of this template.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem? A clear and concise description of the bug.
    validations:
      required: true
  - type: checkboxes
    id: regression
    attributes:
      label: Regression issue
      description: What is a regression? If it worked in a previous version but doesn't in the latest version, it's considered a regression. In this case, please provide the last known working version in the report.
      options:
        - label: Select this option if this issue appears to be a regression.
          required: false
  - type: input
    id: working-version
    attributes:
      label: Last known working version
      description: Specify the last known dataset version where this was functioning as expected (applicable if this is a regression).
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: |
        What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: |
        What actually happened?

        Please include full errors, uncaught exceptions, stack traces, and relevant logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: |
        Provide a self-contained, concise snippet of code or commands that can be used to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: |
        Suggest a fix/reason for the bug
    validations:
      required: false
  - type: input
    id: scenario-version
    attributes:
      label: Scenario/Dataset Version
      description: "E.g. compute-and-data@0.1.34"
    validations:
      required: true
  - type: input
    id: task-name
    attributes:
      label: Task within scenario
      description: "E.g. `create-vpc-valkey-dynamodb`"
    validations:
      required: false
  - type: input
    id: framework-version
    attributes:
      label: aws-bench version
      description: "Git commit and/or branch (e.g. mainline, ad1d9ea)"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: "E.g. claude-code, kiro"
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: Model
      description: "E.g. global.anthropic.claude-sonnet-4-6"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Information/Context
      description: |
        Anything else that might be relevant for troubleshooting this bug. Providing context helps us come up with a solution that is most useful in the real world.
    validations:
      required: false
