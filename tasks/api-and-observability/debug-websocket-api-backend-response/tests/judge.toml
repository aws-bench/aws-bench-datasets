[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "lambda_missing_websocket_endpoint_var"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function flint-agent-message has no WEBSOCKET_ENDPOINT environment variable set."
type = "binary"

[[criterion]]
name = "send_helper_throws_on_undefined_endpoint"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The sendToConnection helper throws 'Cannot read properties of undefined (reading replace)' when it tries to push a reply back because the WEBSOCKET_ENDPOINT env var is not set."
type = "binary"

[[criterion]]
name = "client_receives_no_response"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): No response ever reaches the client because the sendToConnection helper throws an error."
type = "binary"

[[criterion]]
name = "lambda_does_not_recognize_ping_action"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda handler does not recognize the 'ping' action that the agent script sends."
type = "binary"

[[criterion]]
name = "lambda_routes_four_actions_only"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda handler routes only 'heartbeat', 'register', 'agent_connected', and 'register_ui' actions. Satisfied if the junior establishes that 'ping' is not one of the routed/recognized actions and falls through to a default/unhandled path; the junior does not need to enumerate all four routed action names verbatim."
type = "binary"

[[criterion]]
name = "ping_returns_400_via_default_handler"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Ping actions fall through to the default handler and return 400. Satisfied if the junior establishes that unrecognized/unrouted actions like 'ping' are rejected by a default/fallback path; the junior does not need to cite the literal HTTP status code 400."
type = "binary"

[[criterion]]
name = "agent_sh_closes_socket_after_two_seconds"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent.sh keeps each WebSocket open for only about 2 seconds by piping a registration, sleep 1, ping, sleep 1 into websocat and then closing stdin, causing websocat to tear the socket down."
type = "binary"

[[criterion]]
name = "agent_sh_reconnects_every_five_seconds"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent.sh then sleeps 5s and reconnects in a loop, which causes the 'keep disconnecting' behavior."
type = "binary"

[[criterion]]
name = "persistent_sh_keeps_socket_open"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent-persistent.sh in the same S3 bucket keeps the socket open."
type = "binary"

[[criterion]]
name = "professional_sh_keeps_socket_open"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent-professional.sh in the same S3 bucket keeps the socket open."
type = "binary"

[[criterion]]
name = "persistent_sh_uses_ping_action"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent-persistent.sh uses the unrouted 'ping' action."
type = "binary"

[[criterion]]
name = "professional_sh_uses_heartbeat_action"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): flint-agent-professional.sh uses the 'heartbeat' action."
type = "binary"

[[criterion]]
name = "fix_requires_setting_lambda_endpoint_var"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Fixing the backend requires setting WEBSOCKET_ENDPOINT on the Lambda function flint-agent-message."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
