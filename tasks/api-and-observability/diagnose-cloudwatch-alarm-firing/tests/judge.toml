[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_alarm_tracks_p90_framequartzlag_in_the_flint"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The alarm tracks P90 FrameQuartzLag in the Flint namespace."
type = "binary"

[[criterion]]
name = "the_alarm_fires_when_p90_framequartzlag_exceeds_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The alarm fires when P90 FrameQuartzLag exceeds 15 seconds."
type = "binary"

[[criterion]]
name = "the_internal_pipeline_metrics_processframe_motio"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The internal pipeline metrics (ProcessFrame, MotionDetection, HLSStartLag, CPU) are all normal."
type = "binary"

[[criterion]]
name = "the_bottleneck_is_in_the_downstream_quartz_servi"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The bottleneck is in the downstream Quartz service's ReportPerson operation, whose API latency is well above the threshold."
type = "binary"

[[criterion]]
name = "the_elevated_quartz_latency_is_driven_by_the_ssm"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The elevated Quartz latency is driven by the SSM parameter controlling latency mode being set to 'degraded'."
type = "binary"

[[criterion]]
name = "the_ssm_parameter_controlling_latency_mode_is_se"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The SSM parameter controlling latency mode is set to 'degraded'."
type = "binary"

[[criterion]]
name = "the_degraded_latency_mode_causes_the_ecs_task_to"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The 'degraded' latency mode causes the ECS task to publish high Quartz API latency."
type = "binary"

[[criterion]]
name = "the_fix_is_to_set_the_latency_mode_parameter_bac"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The fix is to set the latency mode parameter back to 'healthy'."
type = "binary"

[[criterion]]
name = "the_alarm_fires_due_to_downstream_quartz_latency"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The alarm fires due to downstream Quartz latency, not an issue with the ECS service's own internal processing pipeline."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
