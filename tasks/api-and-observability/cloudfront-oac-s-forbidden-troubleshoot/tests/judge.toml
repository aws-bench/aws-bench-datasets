[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "bucket_policy_lacks_oac_grant"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The S3 bucket policy for {{api-and-observability-cloudfront-laljfb348-us-east-1-TenantServicesBucketName}} does not grant CloudFront OAC access (i.e., has no Allow statement for the cloudfront.amazonaws.com service principal conditioned on the distribution ARN)."
type = "binary"

[[criterion]]
name = "bucket_policy_denies_non_ssl"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The S3 bucket policy for {{api-and-observability-cloudfront-laljfb348-us-east-1-TenantServicesBucketName}} contains a Deny statement for non-SSL traffic."
type = "binary"

[[criterion]]
name = "oac_attached_signs_sigv4"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): OAC {{api-and-observability-cloudfront-laljfb348-us-east-1-OACId}} is attached and signs requests with SigV4."
type = "binary"

[[criterion]]
name = "distribution_tenant_only_mode"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The distribution is configured in tenant-only connection mode."
type = "binary"

[[criterion]]
name = "distribution_has_zero_tenants"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The distribution has zero distribution tenants created (so there is no tenant configuration to route requests through)."
type = "binary"

[[criterion]]
name = "bucket_policy_grant_primary_issue"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The missing bucket policy grant is the primary issue."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
