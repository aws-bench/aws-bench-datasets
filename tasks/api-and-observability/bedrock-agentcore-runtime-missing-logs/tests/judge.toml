[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_iam_deny_policy_on_quartz_team_role_is_not_t"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The IAM deny policy on quartz-team-role is not the cause of the empty vended logs groups."
type = "binary"

[[criterion]]
name = "the_runtime_was_deleted"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The runtime was deleted."
type = "binary"

[[criterion]]
name = "the_runtime_s_cloudwatch_log_groups_were_retaine"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The runtime's CloudWatch log groups were retained after deletion."
type = "binary"

[[criterion]]
name = "the_runtime_log_group_api_and_observability_logs"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The runtime log group {{api-and-observability-logs-6b635d316-us-west-2-BasaltMcpLogGroupName}} still contains historical invocation logs from when the runtime was active."
type = "binary"

[[criterion]]
name = "the_vended_logs_groups_api_and_observability_log"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The vended logs groups {{api-and-observability-logs-6b635d316-us-west-2-BasaltMcpApplicationLogsGroupName}} and {{api-and-observability-logs-6b635d316-us-west-2-BasaltMcpUsageLogsGroupName}} are empty because the AgentCore service is no longer running to deliver logs to them."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
