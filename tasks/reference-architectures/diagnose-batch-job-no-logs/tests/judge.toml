[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_lambda_handler_calls_batch_submit_job_once_a"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda handler calls batch.submit_job once and immediately returns {'statusCode': 200, 'body': {'jobId': ...} } without polling, describing the job, or waiting for a container to start."
type = "binary"

[[criterion]]
name = "a_200_plus_a_jobid_only_confirms_that_the_batch_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): A 200 plus a jobId only confirms that the Batch control plane accepted the submission into the queue; it says nothing about whether anything ever actually ran."
type = "binary"

[[criterion]]
name = "the_job_definition_reference_architectures_batch"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The job definition {{reference-architectures-Batch-openmp-us-east-1-JobDefinitionArn}} references image {{reference-architectures-Batch-openmp-us-east-1-EcrRepositoryUri}} with no tag."
type = "binary"

[[criterion]]
name = "when_no_tag_is_specified_batch_resolves_the_imag"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): When no tag is specified, Batch resolves the image to :latest."
type = "binary"

[[criterion]]
name = "the_ecr_repository_reference_architectures_batch"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ECR repository {{reference-architectures-Batch-openmp-us-east-1-EcrRepositoryName}} is empty with no image ever pushed to it."
type = "binary"

[[criterion]]
name = "the_most_recent_job_on_queue_reference_architect"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The most recent job on queue {{reference-architectures-Batch-openmp-us-east-1-JobQueueArn}} transitions SUBMITTED to RUNNABLE to STARTING to FAILED."
type = "binary"

[[criterion]]
name = "the_most_recent_job_on_queue_reference_architect_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The most recent job on queue {{reference-architectures-Batch-openmp-us-east-1-JobQueueArn}} has a statusReason indicating the container image could not be pulled from the repository (no manifest found)."
type = "binary"

[[criterion]]
name = "the_batch_job_cannot_start_because_the_ecr_repos"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Batch job cannot start because the ECR repository is empty and the container image cannot be pulled."
type = "binary"

[[criterion]]
name = "the_job_definition_has_no_logconfiguration_optio"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The job definition has no logConfiguration.options.awslogs-group override."
type = "binary"

[[criterion]]
name = "when_no_logconfiguration_options_awslogs_group_o"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): When no logConfiguration.options.awslogs-group override is set, Batch's default awslogs driver writes to /aws/batch/job instead of the declared group {{reference-architectures-Batch-openmp-us-east-1-LogGroupName}}."
type = "binary"

[[criterion]]
name = "the_declared_log_group_reference_architectures_b"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The declared log group {{reference-architectures-Batch-openmp-us-east-1-LogGroupName}} will keep reading as empty even after the ECR problem is fixed, because logs will be written to /aws/batch/job instead."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
