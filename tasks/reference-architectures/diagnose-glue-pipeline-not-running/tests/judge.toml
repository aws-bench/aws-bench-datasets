[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_source_action_of_reference_architectures_glu"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Source action of {{reference-architectures-Glue-etlpipeline-us-east-1-PipelineName}} is configured with Provider=CodeCommit and BranchName=main, pointing at {{reference-architectures-Glue-etlpipeline-us-east-1-CodeCommitRepoName}}"
type = "binary"

[[criterion]]
name = "reference_architectures_glue_etlpipeline_us_east"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): {{reference-architectures-Glue-etlpipeline-us-east-1-CodeCommitRepoName}} has zero branches"
type = "binary"

[[criterion]]
name = "the_pipeline_has_exactly_one_execution_in_its_hi"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The pipeline has exactly one execution in its history"
type = "binary"

[[criterion]]
name = "the_one_execution_was_triggered_automatically_by"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The one execution was triggered automatically by CloudFormation when the stack was first deployed"
type = "binary"

[[criterion]]
name = "the_one_execution_failed_at_the_source_stage_in_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The one execution failed at the Source stage in about one second with ConfigurationError: no branch named main was found in the selected AWS CodeCommit repository"
type = "binary"

[[criterion]]
name = "the_eventbridge_rule_that_would_re_trigger_the_p"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The EventBridge rule that would re-trigger the pipeline on a CodeCommit push only fires on referenceCreated/referenceUpdated events where referenceName is main"
type = "binary"

[[criterion]]
name = "until_someone_pushes_an_initial_commit_on_a_main"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Until someone pushes an initial commit on a main branch, the pipeline will never start again on its own"
type = "binary"

[[criterion]]
name = "there_is_no_lambda_log_group_for_the_launcher"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): There is no Lambda log group for the launcher"
type = "binary"

[[criterion]]
name = "none_of_the_downstream_work_has_ever_been_reache"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): None of the downstream work has ever been reached because the Source stage has never succeeded"
type = "binary"

[[criterion]]
name = "the_launcher_lambda_reference_architectures_glue"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The launcher Lambda {{reference-architectures-Glue-etlpipeline-us-east-1-LambdaFunctionName}} implements the Deploy action"
type = "binary"

[[criterion]]
name = "the_launcher_lambda_runs_start_job_run_against_g"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The launcher Lambda runs start_job_run against Glue and then immediately calls put_job_success_result back to CodePipeline, with no get_job_run polling in between"
type = "binary"

[[criterion]]
name = "the_deploy_stage_will_report_success_the_instant"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Deploy stage will report SUCCESS the instant the Glue job is accepted, regardless of whether the Glue job itself fails, times out, or produces garbage"
type = "binary"

[[criterion]]
name = "the_glue_worker_role_has_no_awsglueservicerole_m"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Glue worker role has no AWSGlueServiceRole managed policy attached (list-attached-role-policies returns an empty list)"
type = "binary"

[[criterion]]
name = "the_glue_worker_role_s_single_inline_policy_only"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Glue worker role's single inline policy only grants glue:CreateJob/StartJobRun on the job, KMS on the pipeline key, and S3 read/write on the pipeline artifact bucket"
type = "binary"

[[criterion]]
name = "there_are_no_logs_createloggroup_createlogstream"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): There are no logs:CreateLogGroup/CreateLogStream/PutLogEvents permissions anywhere on the Glue worker role"
type = "binary"

[[criterion]]
name = "there_is_no_cloudwatch_putmetricdata_permission_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): There is no cloudwatch:PutMetricData permission on the Glue worker role"
type = "binary"

[[criterion]]
name = "the_two_glue_actions_createjob_and_startjobrun_t"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The two glue:* actions (CreateJob and StartJobRun) that are on the worker role actually belong on the launcher Lambda, not on the worker role"
type = "binary"

[[criterion]]
name = "once_the_repo_is_seeded_and_the_lambda_finally_f"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Once the repo is seeded and the Lambda finally fires, the Glue job will start, fail when it tries to write to its CloudWatch log group, and the pipeline will still report Deploy SUCCESS because of the fire-and-forget launcher, with the only real failure signal being the JobRunState on the Glue job itself"
type = "binary"

[[criterion]]
name = "all_three_fixes_belong_in_the_same_pr_seed_the_r"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): All three fixes belong in the same PR: seed the repo with an initial main commit that includes the ETL script, change the launcher to poll get_job_run (or use the CodePipeline Lambda continuation token) before reporting success, and attach AWSGlueServiceRole (or at minimum the necessary logs:* permissions) to the GlueRole"
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
