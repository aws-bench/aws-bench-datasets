[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "esm_has_connection_failure"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda event source mapping (ESM) that connects the RabbitMQ broker to the Lambda function shows a connection/connectivity failure preventing it from consuming messages (e.g. errors or a disabled state). Credit this claim if the junior identifies that the ESM has a connection/connectivity failure, even if the junior attributes it to a different, evidence-backed cause (e.g. missing VPC endpoints) rather than specifically saying it cannot reach the target queue."
type = "binary"

[[criterion]]
name = "esm_enabled_with_errors_or_disabled"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ESM may show as Enabled with connection errors or may have been automatically Disabled by AWS after repeated failures."
type = "binary"

[[criterion]]
name = "target_queue_does_not_exist"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The target queue {{reference-architectures-AmazonMQ-rabbitmq-us-east-1-QueueName}} does not exist on the broker."
type = "binary"

[[criterion]]
name = "create_queue_and_reenable_esm"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): To fix: create the queue on the broker and, if the ESM was disabled, re-enable it."
type = "binary"

[[criterion]]
name = "lambda_stub_does_not_affect_consumption"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda handler is a minimal stub that only logs messages, but this does not affect whether messages are consumed from the queue."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. CLARIFICATION SPECIFIC TO THIS TASK: the reference identifies two operational blockers (ESM connection failure, missing queue). If the junior leads with an additional evidence-backed blocker (e.g. missing VPC endpoints) and, in that context, describes the queue's state as unconfirmed, secondary, or not yet verified rather than affirmatively asserting the queue DOES exist, that is not a contradiction -- it is merely not independently re-confirming a fact, which this criterion does not require. Only answer 'no' here if the junior affirmatively states the queue exists or is reachable, actively negating the reference's stated fact. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
