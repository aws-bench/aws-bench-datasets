[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "service_desired_count_is_zero"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The service has desiredCount set to 0"
type = "binary"

[[criterion]]
name = "deployment_status_completed"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The deployment status is COMPLETED"
type = "binary"

[[criterion]]
name = "service_healthy_at_zero_tasks"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The service successfully reached its target of 0 running tasks because desiredCount is 0, so the service is not failing"
type = "binary"

[[criterion]]
name = "ecr_repository_has_no_images"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ECR repository {{troubleshooting-multiservice-ecs-i5l02s5g8-us-west-2-EcrRepositoryName}} has no images pushed to it"
type = "binary"

[[criterion]]
name = "service_runs_in_isolated_subnets"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The service runs in private isolated subnets"
type = "binary"

[[criterion]]
name = "subnets_lack_nat_gateway"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The private isolated subnets have no NAT gateway"
type = "binary"

[[criterion]]
name = "subnets_lack_ecr_vpc_endpoints"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The private isolated subnets have no VPC endpoints for ECR"
type = "binary"

[[criterion]]
name = "tasks_cannot_start_when_scaled_up"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): If desiredCount is increased, tasks will fail to start because the ECR repository has no images and tasks have no network path to pull container images due to the subnet isolation"
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
