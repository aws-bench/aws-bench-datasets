[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "all_executions_fail_at_the_invokeprocessinglambd"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): All executions fail at the InvokeProcessingLambda state. InvokeProcessingLambda is this state machine's only task state, so identifying the one Lambda function that fails (with the correct ARN and error message) satisfies this claim even if the junior never uses the literal state name -- do not fail this claim solely for omitting the state-name label when the junior correctly pinpoints the single failing Lambda invocation."
type = "binary"

[[criterion]]
name = "the_lambda_function_troubleshooting_multiservice"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function {{troubleshooting-multiservice-lambda-mw9wjm2q7-ap-southeast-2-ProcessingLambdaArn}} throws a RuntimeError: \"Configuration validation failed: missing required field 'targetBucket'\""
type = "binary"

[[criterion]]
name = "the_executions_fail_because_the_lambda_function_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The executions fail because the Lambda function {{troubleshooting-multiservice-lambda-mw9wjm2q7-ap-southeast-2-ProcessingLambdaArn}} throws a RuntimeError: \"Configuration validation failed: missing required field 'targetBucket'\""
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
