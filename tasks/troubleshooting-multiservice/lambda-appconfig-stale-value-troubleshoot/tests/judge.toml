[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "lambda_env_vars_use_logical_ids"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-LambdaFunctionName}} is not reading the updated AppConfig value because its environment variables APP_CONFIG_APPLICATION, APP_CONFIG_ENVIRONMENT, and APP_CONFIG_CONFIGURATION are set to CloudFormation logical IDs (GRNCMSAppConfigApplication537888D7, GRNCMSAppConfigEnvironment9802B737, GRNCMSAppConfigConfigurationConfigurationProfile7AB3584E) instead of the actual resource names (GarnetAppConfig, beta, GarnetServicebeta-GRNCMSAppConfigConfiguration-EE839D38)."
type = "binary"

[[criterion]]
name = "app_config_application_env_var_value"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-LambdaFunctionName}} environment variable APP_CONFIG_APPLICATION is set to GRNCMSAppConfigApplication537888D7."
type = "binary"

[[criterion]]
name = "app_config_environment_env_var_value"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-LambdaFunctionName}} environment variable APP_CONFIG_ENVIRONMENT is set to GRNCMSAppConfigEnvironment9802B737."
type = "binary"

[[criterion]]
name = "app_config_configuration_env_var_value"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Lambda function {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-LambdaFunctionName}} environment variable APP_CONFIG_CONFIGURATION is set to GRNCMSAppConfigConfigurationConfigurationProfile7AB3584E."
type = "binary"

[[criterion]]
name = "actual_appconfig_resource_names"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The actual AppConfig resource names are GarnetAppConfig (application), beta (environment), and GarnetServicebeta-GRNCMSAppConfigConfiguration-EE839D38 (configuration profile)."
type = "binary"

[[criterion]]
name = "logical_ids_cause_resource_not_found"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Any call to the AppConfig API using these logical IDs will fail with a ResourceNotFoundException."
type = "binary"

[[criterion]]
name = "fix_update_env_vars_to_actual_names"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): To fix this, update the three environment variables to the actual resource names."
type = "binary"

[[criterion]]
name = "appconfig_deployment_completed_successfully"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The AppConfig deployment itself completed successfully with application ID {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-AppConfigApplicationId}}, environment ID {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-AppConfigEnvironmentId}}, and configuration profile ID {{troubleshooting-multiservice-lambda-1sscp39dx-us-west-2-AppConfigConfigurationProfileId}}."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
