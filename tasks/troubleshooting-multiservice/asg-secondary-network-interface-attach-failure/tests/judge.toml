[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "eni_attachment_for_instances_in_troubleshooting_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): ENI attachment for instances in {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-AutoScalingGroupName}} fails due to two issues"
type = "binary"

[[criterion]]
name = "the_asg_troubleshooting_multiservice_ec2_nx19kzw"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ASG {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-AutoScalingGroupName}} has a tag Customer-SG with value {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSGTagValue}}"
type = "binary"

[[criterion]]
name = "the_asg_troubleshooting_multiservice_ec2_nx19kzw_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ASG {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-AutoScalingGroupName}} has a tag Customer-Subnet with value {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSubnetTagValue}}"
type = "binary"

[[criterion]]
name = "troubleshooting_multiservice_ec2_nx19kzwoj_us_we"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSGTagValue}} does not exist"
type = "binary"

[[criterion]]
name = "troubleshooting_multiservice_ec2_nx19kzwoj_us_we_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSubnetTagValue}} does not exist"
type = "binary"

[[criterion]]
name = "the_actual_customer_security_group_is_troublesho"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The actual customer security group is {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSecurityGroupId}}"
type = "binary"

[[criterion]]
name = "the_actual_customer_subnet_is_troubleshooting_mu"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The actual customer subnet is {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-CustomerSubnetId}}"
type = "binary"

[[criterion]]
name = "the_instance_role_troubleshooting_multiservice_e"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The instance role {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-InstanceRoleName}} only has Secrets Manager permissions"
type = "binary"

[[criterion]]
name = "the_instance_role_troubleshooting_multiservice_e_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The instance role {{troubleshooting-multiservice-ec2-nx19kzwoj-us-west-2-InstanceRoleName}} is missing EC2 permissions needed to manage network interfaces, such as ec2:CreateNetworkInterface, ec2:CreateNetworkInterfacePermission, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, and ec2:DescribeSecurityGroups"
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
