[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "no_spark_steps_submitted"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): No Spark steps have been submitted to the cluster, so no job is currently running."
type = "binary"

[[criterion]]
name = "driver_memory_set_to_60g"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.driver.memory is set to 60G in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "m5_2xlarge_has_32gb_memory"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The m5.2xlarge instance has total memory of 32 GB."
type = "binary"

[[criterion]]
name = "driver_memory_exceeds_instance_capacity"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.driver.memory of 60G exceeds the total memory of an m5.2xlarge instance (32 GB), which would prevent the driver from launching at all."
type = "binary"

[[criterion]]
name = "executor_instances_set_to_425"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.executor.instances is set to 425 in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "executor_memory_set_to_20g"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.executor.memory is set to 20G in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "executor_memory_overhead_set_to_3g"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.yarn.executor.memoryOverhead is set to 3G in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "core_fleet_targets_one_instance"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The core instance fleet targets only 1 m5.2xlarge instance."
type = "binary"

[[criterion]]
name = "insufficient_capacity_for_executors"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): With 23 GB per executor and the core instance fleet targeting only 1 m5.2xlarge instance (32 GB), YARN could provision at most 1 executor, leaving the remaining 424 requested executors never allocated and the vast majority of Spark tasks waiting indefinitely."
type = "binary"

[[criterion]]
name = "dynamic_allocation_disabled"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.dynamicAllocation.enabled is false in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "cannot_scale_executor_count"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): With spark.dynamicAllocation.enabled set to false, Spark cannot scale the executor count down to match actual cluster capacity."
type = "binary"

[[criterion]]
name = "shuffle_partitions_set_to_3000"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.sql.shuffle.partitions is set to 3000 in the spark-defaults configuration."
type = "binary"

[[criterion]]
name = "shuffle_partitions_add_overhead"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): spark.sql.shuffle.partitions of 3000 adds unnecessary scheduling overhead relative to the 1 available executor."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
