[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_stack_is_failing_because_the_lambda_alias_re"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The stack is failing because the Lambda alias resources reference hardcoded function versions that don't exist."
type = "binary"

[[criterion]]
name = "simpleemailservicelambdaalias_references_version"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): SimpleEmailServiceLambdaAlias references version 593 of {{troubleshooting-multiservice-cloudformation-t9dx4pgqw-us-east-1-SimpleEmailServiceLambdaArn}}."
type = "binary"

[[criterion]]
name = "getdetectoroutcomelambdaalias_references_version"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): GetDetectorOutcomeLambdaAlias references version 268 of {{troubleshooting-multiservice-cloudformation-t9dx4pgqw-us-east-1-GetDetectorOutcomeLambdaArn}}."
type = "binary"

[[criterion]]
name = "the_fix_is_to_correct_the_versions_and_redeploy"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): the fix is to correct the hardcoded Lambda alias version numbers in the CloudFormation template (e.g. via !GetAtt Function.Version instead of a literal number) and redeploy. This is satisfied by EITHER of two valid AWS procedures: (a) first run aws cloudformation rollback-stack to reach UPDATE_ROLLBACK_COMPLETE, then redeploy the corrected template, OR (b) directly redeploy the corrected template via a normal update-stack call -- (b) is also valid here because DisableRollback=true already caused CloudFormation to revert only the two failed Lambda alias resources while the rest of the stack already reached a stable COMPLETE state, so there is nothing left to roll back. Do not fail this claim solely because the junior chose procedure (b) instead of (a), or because the junior explicitly says continue-update-rollback / rollback-stack isn't needed -- that is a correct, evidence-backed observation about this specific stack's state, not a contradiction."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
