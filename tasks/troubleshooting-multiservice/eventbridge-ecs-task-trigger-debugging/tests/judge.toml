[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "eventbridge_rule_has_two_issues"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The EventBridge rule {{troubleshooting-multiservice-eventbridge-odyzjo3n0-us-east-1-EventBridgeRuleName}} has two issues preventing it from working."
type = "binary"

[[criterion]]
name = "ap_southeast_7_has_no_resources"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): No resources exist in ap-southeast-7."
type = "binary"

[[criterion]]
name = "task_definition_references_nonexistent_bucket"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ECS task definition has a hardcoded S3_LOCATION environment variable pointing to a bucket that does not exist in this account."
type = "binary"

[[criterion]]
name = "task_role_limited_to_deployment_bucket"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The task role only has S3 read permissions for {{troubleshooting-multiservice-eventbridge-odyzjo3n0-us-east-1-DeploymentBucketName}}."
type = "binary"

[[criterion]]
name = "task_fails_with_access_denied"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): When the task runs it will fail with access denied."
type = "binary"

[[criterion]]
name = "s3_location_hardcoded_in_template"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The S3_LOCATION path is a literal string in the CloudFormation template, so redeploying the stack doesn't fix it."
type = "binary"

[[criterion]]
name = "rule_targets_specific_task_definition"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The EventBridge rule target is {{troubleshooting-multiservice-eventbridge-odyzjo3n0-us-east-1-TaskDefinitionArn}}."
type = "binary"

[[criterion]]
name = "rule_invokes_pinned_revision"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Any code changes you deploy create a new revision, but the rule keeps invoking the pinned revision."
type = "binary"

[[criterion]]
name = "ap_southeast_7_lacks_deployed_resources"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): There are no EventBridge rules, ECS clusters, or task definitions deployed in ap-southeast-7."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
