[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "outbound_internet_traffic_from_instance_troubles"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Outbound internet traffic from instance {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-WorkloadInstanceId}} does not pass through AWS Network Firewall."
type = "binary"

[[criterion]]
name = "the_dmz_vpc_troubleshooting_multiservice_ec2_m3j"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The DMZ VPC {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-DMZVPCId}} has no Internet Gateway."
type = "binary"

[[criterion]]
name = "the_dmz_vpc_troubleshooting_multiservice_ec2_m3j_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The DMZ VPC {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-DMZVPCId}} route tables only contain the local 10.2.0.0/16 route."
type = "binary"

[[criterion]]
name = "traffic_never_reaches_the_firewall_endpoints"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Traffic never reaches the firewall endpoints."
type = "binary"

[[criterion]]
name = "the_workload_subnet_route_table_troubleshooting_"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The workload subnet route table {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-WorkloadSubnetRouteTableId}} sends 0.0.0.0/0 to Transit Gateway {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-TransitGatewayId}}."
type = "binary"

[[criterion]]
name = "the_tgw_route_table_troubleshooting_multiservice"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The TGW route table {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-TGWRouteTableId}} forwards 0.0.0.0/0 to the DMZ VPC attachment {{troubleshooting-multiservice-ec2-m3jbrd9n2-ap-northeast-2-DMZVPCAttachmentId}}."
type = "binary"

[[criterion]]
name = "the_dmz_vpc_has_no_path_out"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The DMZ VPC has no path out."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
