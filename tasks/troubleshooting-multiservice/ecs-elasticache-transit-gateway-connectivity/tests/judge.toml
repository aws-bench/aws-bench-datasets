[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "ecs_cannot_reach_elasticache_missing_routes"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ECS service `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-EcsServiceName}}` cannot reach ElastiCache cluster `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-ElastiCacheClusterId}}` because routes are missing in three places"
type = "binary"

[[criterion]]
name = "ecs_route_table_1_lacks_tgw_route"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-EcsPrivateRouteTable1Id}}` does not have a route for 13.7.0.0/24 via Transit Gateway `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-TransitGatewayId}}`"
type = "binary"

[[criterion]]
name = "ecs_route_table_2_lacks_tgw_route"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-EcsPrivateRouteTable2Id}}` does not have a route for 13.7.0.0/24 via Transit Gateway `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-TransitGatewayId}}`"
type = "binary"

[[criterion]]
name = "traffic_routed_to_nat_gateway"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Traffic to the ElastiCache VPC is currently sent to the NAT Gateway instead"
type = "binary"

[[criterion]]
name = "cache_route_table_has_local_only"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-CachePrivateRouteTable1Id}}` only has a local route and lacks a route for 13.1.0.0/16 back via the Transit Gateway"
type = "binary"

[[criterion]]
name = "cache_tgw_route_table_empty"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-CacheTgwRouteTableId}}` is empty"
type = "binary"

[[criterion]]
name = "cache_tgw_route_table_associated"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): `{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-CacheTgwRouteTableId}}` is associated with the Cache VPC attachment (`{{troubleshooting-multiservice-ecs-bp8hv08t8-us-east-1-CacheVpcTgwAttachmentId}}`)"
type = "binary"

[[criterion]]
name = "transit_gateway_correctly_configured"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Transit Gateway itself is correctly configured"
type = "binary"

[[criterion]]
name = "vpc_attachments_correctly_configured"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Both VPC attachments are correctly configured"
type = "binary"

[[criterion]]
name = "elasticache_sg_allows_port_11211"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ElastiCache security group has port 11211 open to 13.1.0.0/16"
type = "binary"

[[criterion]]
name = "ecs_service_correctly_configured"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The ECS service is correctly configured"
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
