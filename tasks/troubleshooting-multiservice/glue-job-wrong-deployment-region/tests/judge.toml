[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "glue_job_missing_from_expected_region"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): BasaltDataAnalyzer-RoleReport isn't in {{troubleshooting-multiservice-glue-c3j34cj9z-us-west-2-ExpectedRegion}} at all"
type = "binary"

[[criterion]]
name = "glue_job_deployed_to_wrong_region"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): BasaltDataAnalyzer-RoleReport deployed to {{troubleshooting-multiservice-glue-c3j34cj9z-us-west-2-DeploymentRegion}} as {{troubleshooting-multiservice-glue-c3j34cj9z-us-west-2-GlueJobName}}"
type = "binary"

[[criterion]]
name = "cloudformation_stack_deployed_wrong_region"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The cause is that its CloudFormation stack was deployed to the wrong region"
type = "binary"

[[criterion]]
name = "glue_job_regional_cannot_move"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): A Glue job is regional and can't be moved in place"
type = "binary"

[[criterion]]
name = "glue_job_depends_on_stack_resources"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The Glue job depends on the IAM role and S3 buckets the same stack created alongside it"
type = "binary"

[[criterion]]
name = "fix_requires_redeploying_entire_stack"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Getting it into {{troubleshooting-multiservice-glue-c3j34cj9z-us-west-2-ExpectedRegion}} means redeploying the whole stack there, not just recreating the job, then tearing down the {{troubleshooting-multiservice-glue-c3j34cj9z-us-west-2-DeploymentRegion}} stack if unwanted"
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
