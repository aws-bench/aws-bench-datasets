[judge]
judge = "bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0"
files = [
    "/logs/agent/agent-output.txt",
    "/tests/ground_truth.json",
]
prompt_template = "judge_prompt.md"
mode = "batched"

[[criterion]]
name = "the_instances_in_asg_troubleshooting_multiservic"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The instances in ASG {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-AutoScalingGroupName}} were launched without an SSH key pair."
type = "binary"

[[criterion]]
name = "the_instances_in_asg_troubleshooting_multiservic_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The instances in ASG {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-AutoScalingGroupName}} are in private subnet {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-PrimarySubnetId}}."
type = "binary"

[[criterion]]
name = "subnet_troubleshooting_multiservice_sagemaker_yh"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Subnet {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-PrimarySubnetId}} has CIDR 172.25.0.0/24."
type = "binary"

[[criterion]]
name = "the_instances_in_asg_troubleshooting_multiservic_3"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The instances in ASG {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-AutoScalingGroupName}} have no public IP address."
type = "binary"

[[criterion]]
name = "network_acl_troubleshooting_multiservice_sagemak"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Network ACL {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-PrivateSubnetNaclId}} is associated with subnet {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-PrimarySubnetId}}."
type = "binary"

[[criterion]]
name = "network_acl_troubleshooting_multiservice_sagemak_2"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): Network ACL {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-PrivateSubnetNaclId}} has rule 50 that explicitly denies inbound TCP port 22."
type = "binary"

[[criterion]]
name = "ssh_to_instances_in_asg_troubleshooting_multiser"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): SSH to instances in ASG {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-AutoScalingGroupName}} is blocked because the instances were launched without an SSH key pair, they are in a private subnet with no public IP address, and the network ACL explicitly denies inbound TCP port 22."
type = "binary"

[[criterion]]
name = "the_best_option_for_connecting_is_ssm_session_ma"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): The best option for connecting is SSM Session Manager via aws ssm start-session."
type = "binary"

[[criterion]]
name = "ssm_session_manager_is_already_configured_and_re"
description = "Per the rubric, does the junior engineer's answer support this claim (wording may differ, substance must match): SSM Session Manager is already configured and ready to use for the instances in ASG {{troubleshooting-multiservice-sagemaker-yhxcakof0-us-west-2-AutoScalingGroupName}}."
type = "binary"

[[criterion]]
name = "no_extraneous_or_contradicting_facts"
description = "Per the rubric's Fail-If and Clarifications rules, does the junior engineer's answer AVOID both of the following: (1) stating any fact that contradicts the reference answer's stated infrastructure state (e.g. a different count, the wrong resource, an opposite status), and (2) claiming the existence of additional resources, findings, or facts beyond what the reference answer states, UNSUPPORTED by concrete evidence, in a way that would mislead a practitioner into a different conclusion or action. Judge the junior's answer as a whole against the entire reference answer for this, not any single claim. IMPORTANT: an additional finding that cites specific, concrete evidence (a resource ID, an exact error/log message, an API response, or a well-established AWS behavior) and does not contradict anything the reference states is a legitimate supplementary discovery, not a violation of this criterion, even if the reference answer doesn't mention it -- the reference answer is not guaranteed to be exhaustive. Only answer 'no' for extra claims that are vague, unsupported by any cited evidence, or that directly contradict a fact the reference explicitly states. Answer 'yes' if the junior's answer contains no such contradiction or unsupported extra claim; answer 'no' if it does."
type = "binary"
